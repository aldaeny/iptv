name: DriveLink CI & Android Release Build

# Two paths:
#  * pull_request / push  -> verification only (identity, protocol, crypto, syntax).
#  * workflow_dispatch    -> full build of Standard + FullTouch + Receiver APKs,
#                            signing + metadata verification, SHA-256 and iOS build.
#
# Release publication runs only in the separate, manually triggered
# "DriveLink Publish Release" workflow, after a release run has been reviewed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "DriveLink/**"
      - ".github/workflows/drivelink-android-release.yml"
  push:
    branches:
      - "master"
      - "arena/**"
    paths:
      - "DriveLink/**"
      - ".github/workflows/drivelink-android-release.yml"

permissions:
  contents: read

env:
  # Pinned toolchain — keep in sync with DriveLink/android/gradle/wrapper and AGP.
  GRADLE_VERSION: "8.10.2"
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Package identity, protocol parity and crypto suite
        run: |
          set -o pipefail
          python3 DriveLink/tests/verify_isolation.py
          python3 DriveLink/tests/verify_protocol.py
          python3 DriveLink/tests/verify_release.py
          node DriveLink/tests/crypto_fuzz_suite.mjs
      - name: Simulator UI wiring (real index.html, DOM/WebSocket stub)
        run: node DriveLink/tests/simulator_ui_wiring.mjs
      - name: Go simulator unit tests (race detector)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.22"
          cache: false
      - run: |
          set -o pipefail
          cd DriveLink/simulator
          go vet ./...
          go test -race -v ./... 2>&1 | tee ../../go-test.log
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid=" -o /tmp/BydScreenSimulator-Windows.exe .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid=" -o /tmp/BydScreenSimulator-Linux .
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivelink-verification-logs
          path: |
            go-test.log
            /tmp/BydScreenSimulator-Windows.exe
            /tmp/BydScreenSimulator-Linux
          if-no-files-found: warn
          retention-days: 30

  android:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          printf '%s\n' "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"
      - name: Configure release keystore (optional)
        id: signmode
        env:
          KEYSTORE_B64: ${{ secrets.DRIVELINK_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.DRIVELINK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRIVELINK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DRIVELINK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::warning::No DRIVELINK_KEYSTORE_* secrets; release APKs will be built UNSIGNED and are not publishable."
            echo "DRIVELINK_RELEASE_SIGNABLE=false" >> "$GITHUB_ENV"
            # Unsigned output must never land in the publishable artifact name.
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/drivelink-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          {
            echo "DRIVELINK_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "DRIVELINK_KEYSTORE_PASSWORD=$KEYSTORE_PASS"
            echo "DRIVELINK_KEY_ALIAS=$KEY_ALIAS"
            echo "DRIVELINK_KEY_PASSWORD=$KEY_PASS"
            echo "DRIVELINK_RELEASE_SIGNABLE=true"
          } >> "$GITHUB_ENV"
          echo "mode=signed" >> "$GITHUB_OUTPUT"
          echo "Release keystore configured from repository secrets."
      - name: Re-run source release gate against the exact build commit
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 DriveLink/tests/verify_release.py
      - name: Unit tests & lint (Standard, FullTouch, Receiver)
        run: |
          set -o pipefail
          (cd DriveLink/android && ./gradlew --no-daemon --stacktrace \
             :app:testStandardDebugUnitTest :app:testFullTouchDebugUnitTest \
             :app:lintStandardDebug :app:lintFullTouchDebug)
          (cd DriveLink/receiver-dilink && ./gradlew --no-daemon --stacktrace \
             :app:testDebugUnitTest :app:lintDebug)
      - name: Build release variants (unsigned when no keystore)
        run: |
          set -o pipefail
          (cd DriveLink/android && ./gradlew --no-daemon --stacktrace :app:assembleStandardRelease :app:assembleFullTouchRelease)
          (cd DriveLink/receiver-dilink && ./gradlew --no-daemon --stacktrace :app:assembleRelease)
      - name: Verify packages, versions, signing and SHA-256
        env:
          DRIVELINK_SIGNER_SHA256: ${{ vars.DRIVELINK_SIGNER_SHA256 }}
        run: |
          set -o pipefail
          if [ "$DRIVELINK_RELEASE_SIGNABLE" = "true" ]; then
            bash DriveLink/tools/verify-android-build.sh release DriveLink "$RUNNER_TEMP/drivelink-release"
          else
            bash DriveLink/tools/verify-android-build.sh unsigned DriveLink "$RUNNER_TEMP/drivelink-release"
          fi
      - name: Build debug APKs (installable smoke-test artifacts)
        run: |
          set -o pipefail
          (cd DriveLink/android && ./gradlew --no-daemon --stacktrace :app:assembleStandardDebug :app:assembleFullTouchDebug)
          (cd DriveLink/receiver-dilink && ./gradlew --no-daemon --stacktrace :app:assembleDebug)
          bash DriveLink/tools/verify-android-build.sh debug DriveLink "$RUNNER_TEMP/drivelink-debug"
      - name: Collect build logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/drivelink-logs"
          find DriveLink -name "lint-results*.txt" -o -name "lint-results*.html" | while read -r f; do
            cp --parents "$f" "$RUNNER_TEMP/drivelink-logs" || true
          done
      - name: Upload release artifacts (APK + SIGNING_REPORT + SHA256SUMS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Signed builds only ever land under drivelink-release-<sha>. Builds
          # without a keystore are quarantined under drivelink-unsigned-<sha>, a
          # name the publish workflow refuses to download.
          name: drivelink-${{ steps.signmode.outputs.mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/drivelink-release/
          if-no-files-found: error
          retention-days: 90
      - name: Upload debug artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivelink-debug-${{ github.sha }}
          path: ${{ runner.temp }}/drivelink-debug/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivelink-android-logs-${{ github.sha }}
          path: ${{ runner.temp }}/drivelink-logs/
          if-no-files-found: warn
          retention-days: 30

  ios:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift package tests
        run: |
          set -o pipefail
          cd DriveLink/ios && swift test 2>&1 | tee swift-test.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Full (unsigned) + package IPA
        run: |
          set -euo pipefail
          cd DriveLink/ios
          xcodegen generate --spec Project.yml
          xcodebuild -project BydWirelessMirror.xcodeproj -scheme BydWirelessMirror \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-full CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-full.log
          mkdir -p "$RUNNER_TEMP/drivelink-ios/Payload"
          cp -R build-full/Build/Products/Release-iphoneos/BydWirelessMirror.app "$RUNNER_TEMP/drivelink-ios/Payload/"
          (cd "$RUNNER_TEMP/drivelink-ios" && zip -qry DriveLink-Full-unsigned.ipa Payload)
      - name: Build Free Sideload (unsigned) + package IPA
        run: |
          set -euo pipefail
          cd DriveLink/ios
          xcodegen generate --spec Project-free.yml
          xcodebuild -project BydWirelessMirrorFree.xcodeproj -scheme BydWirelessMirror \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-free CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-free.log
          mkdir -p "$RUNNER_TEMP/drivelink-ios/Payload"
          rm -rf "$RUNNER_TEMP/drivelink-ios/Payload/"*
          cp -R build-free/Build/Products/Release-iphoneos/BydWirelessMirror.app "$RUNNER_TEMP/drivelink-ios/Payload/"
          (cd "$RUNNER_TEMP/drivelink-ios" && zip -qry DriveLink-Free-unsigned.ipa Payload)
      - name: Verify IPA metadata and checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/drivelink-ios"
          rm -rf Payload
          for ipa in *.ipa; do
            unzip -q "$ipa" -d "check-${ipa%.ipa}"
            plist="check-${ipa%.ipa}/Payload/BydWirelessMirror.app/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" | grep -Fx 1.4.1
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -Fx 3
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" | grep -Fx "app.drivelink.cast.app${ipa#DriveLink-Full}"
          done
          shasum -a 256 *.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload unsigned iOS IPAs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivelink-ios-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/drivelink-ios/*.ipa
            ${{ runner.temp }}/drivelink-ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivelink-ios-logs-${{ github.sha }}
          path: |
            DriveLink/ios/swift-test.log
            DriveLink/ios/xcodebuild-full.log
            DriveLink/ios/xcodebuild-free.log
          if-no-files-found: warn
          retention-days: 30
