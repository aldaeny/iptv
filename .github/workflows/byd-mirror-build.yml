name: BYD Mirror Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - "byd-mirror/**"

permissions:
  contents: read

jobs:
  verify-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run protocol & manifest verification
        run: python3 byd-mirror/tests/verify_protocol.py

  build-android-phone:
    runs-on: ubuntu-latest
    needs: verify-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test & build Android Phone APK
        working-directory: byd-mirror/android
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: byd-phone-debug-apk
          path: byd-mirror/android/app/build/outputs/apk/debug/app-debug.apk

  build-byd-receiver:
    runs-on: ubuntu-latest
    needs: verify-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test & build BYD DiLink Receiver APK
        working-directory: byd-mirror/receiver-dilink
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: byd-dilink-receiver-debug-apk
          path: byd-mirror/receiver-dilink/app/build/outputs/apk/debug/app-debug.apk

  build-ios-check:
    runs-on: macos-latest
    needs: verify-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Swift Package tests
        working-directory: byd-mirror/ios
        run: swift test
      - name: Install XcodeGen & build unsigned iOS targets
        working-directory: byd-mirror/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project BydWirelessMirror.xcodeproj \
            -scheme BydWirelessMirror \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BydWirelessMirror.app Payload/
          zip -qry BydWirelessMirror-unsigned.ipa Payload
      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: byd-ios-unsigned-ipa
          path: byd-mirror/ios/BydWirelessMirror-unsigned.ipa
