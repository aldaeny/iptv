name: BYD Mirror Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - "byd-mirror/**"
      - ".github/workflows/byd-mirror-build.yml"

permissions:
  contents: write

jobs:
  verify-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run protocol & manifest verification
        run: python3 byd-mirror/tests/verify_protocol.py

  build-android-phone:
    runs-on: ubuntu-latest
    needs: verify-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
      - name: Test & build Android Phone APK
        working-directory: byd-mirror/android
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug 2>&1 | tee gradle.log; then
            grep -E "(^e: |FAILURE:|Exception|What went wrong:)" -A 3 gradle.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: byd-phone-debug-apk
          path: byd-mirror/android/app/build/outputs/apk/debug/app-debug.apk

  build-byd-receiver:
    runs-on: ubuntu-latest
    needs: verify-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
      - name: Test & build BYD DiLink Receiver APK
        working-directory: byd-mirror/receiver-dilink
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug 2>&1 | tee gradle.log; then
            grep -E "(^e: |FAILURE:|Exception|What went wrong:)" -A 3 gradle.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: byd-dilink-receiver-debug-apk
          path: byd-mirror/receiver-dilink/app/build/outputs/apk/debug/app-debug.apk

  build-ios-check:
    runs-on: macos-latest
    needs: verify-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Swift Package tests
        working-directory: byd-mirror/ios
        run: swift test
      - name: Install XcodeGen & build unsigned iOS targets
        working-directory: byd-mirror/ios
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          if ! xcodebuild -project BydWirelessMirror.xcodeproj \
            -scheme BydWirelessMirror \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log; then
            grep -E "(error:|fatal error:|BUILD FAILED)" xcodebuild.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BydWirelessMirror.app Payload/
          zip -qry BydWirelessMirror-unsigned.ipa Payload
      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: byd-ios-unsigned-ipa
          path: byd-mirror/ios/BydWirelessMirror-unsigned.ipa

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android-phone, build-byd-receiver, build-ios-check]
    if: always() && (needs.build-android-phone.result == 'success' || needs.build-byd-receiver.result == 'success' || needs.build-ios-check.result == 'success')
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare direct APK & IPA files
        run: |
          mkdir -p release-assets
          if [ -f downloaded-artifacts/byd-phone-debug-apk/app-debug.apk ]; then
            cp downloaded-artifacts/byd-phone-debug-apk/app-debug.apk release-assets/BydMirror-Phone-debug.apk
          fi
          if [ -f downloaded-artifacts/byd-dilink-receiver-debug-apk/app-debug.apk ]; then
            cp downloaded-artifacts/byd-dilink-receiver-debug-apk/app-debug.apk release-assets/BydMirror-DiLink-Receiver-debug.apk
          fi
          if [ -f downloaded-artifacts/byd-ios-unsigned-ipa/BydWirelessMirror-unsigned.ipa ]; then
            cp downloaded-artifacts/byd-ios-unsigned-ipa/BydWirelessMirror-unsigned.ipa release-assets/BydWirelessMirror-unsigned.ipa
          fi
          ls -lh release-assets

      - name: Publish GitHub Pre-release with direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No release assets to publish"
            exit 1
          fi
          REPO="${{ github.repository }}"
          NOTES="Direct APK & IPA downloads (no ZIP wrapper) built from \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)."
          if gh release view byd-mirror-latest -R "$REPO" >/dev/null 2>&1; then
            gh release edit byd-mirror-latest -R "$REPO" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "BYD Wireless Mirror (Latest Build)" \
              --notes "$NOTES" 2>&1 || {
                echo "::error::Failed to update release metadata"
                exit 1
              }
            gh release upload byd-mirror-latest release-assets/* -R "$REPO" --clobber 2>&1 || {
              echo "::error::Failed to upload release assets"
              exit 1
            }
          else
            gh release create byd-mirror-latest release-assets/* -R "$REPO" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "BYD Wireless Mirror (Latest Build)" \
              --notes "$NOTES" 2>&1 || {
                echo "::error::Failed to create GitHub Pre-release"
                exit 1
              }
          fi
