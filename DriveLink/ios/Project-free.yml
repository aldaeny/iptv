# Free Sideload build: a single app target with ONE bundle identifier, so the whole
# app (ReplayKit handler + Live Activity code) lives in one process and needs no
# App Group / extension provisioning profile. See docs/IOS_GUIDE.md.
name: BydWirelessMirrorFree
options:
  bundleIdPrefix: app.drivelink.cast
  deploymentTarget:
    iOS: "16.2"

targets:
  BydWirelessMirror:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
    entitlements:
      path: BydMirror-free.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.drivelink.cast.app.free
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: BydMirror-free.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
