name: BydWirelessMirror
options:
  bundleIdPrefix: app.drivelink.cast
  deploymentTarget:
    iOS: "16.2"

targets:
  BydWirelessMirror:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.drivelink.cast.app
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: BydMirror.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BydBroadcastExtension
      - target: BydLiveActivityExtension

  BydBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes: [Info.plist]
      - path: Sources/Core
        excludes:
          - Session/DirectMirrorSession.swift
          - Streaming/LiveActivityManager.swift
          - Streaming/PipOverlayController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.drivelink.cast.app.broadcast
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BydMirror.entitlements

  BydLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
        excludes: [Info.plist]
      - path: Sources/Core/Models/BydLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.drivelink.cast.app.liveactivity
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BydMirror.entitlements
